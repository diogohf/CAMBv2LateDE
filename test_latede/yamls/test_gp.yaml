## Run from cocoa/Cocoa (stable version v4.071)
output: ../../coupled-quintessence/chains/test_gp

stop_at_error: false
debug: false
timing: true

theory:
  camb:
    path: ./external_modules/code/CAMBv2LateDE
    use_renames: True
    extra_args:
      AccuracyBoost: 1.0
      lens_potential_accuracy: 2
      num_massive_neutrinos: 1
      nnu: 3.046
      dark_energy_model: ppf
      DEmodel: 8
      # Gaussian-process kernel:
      #   1 = squared-exponential / RBF
      #       K_ij = sigma_GP^2 exp[-0.5 (Delta z / ell_GP)^2]
      #
      #   2 = exponential / Holsclaw alpha=1
      #       K_ij = sigma_GP^2 exp[-|Delta z| / ell_GP]
      #
      # Change only this flag to switch GP kernels.
      gp_kernel: 1
      gp_zmax: 3.5
      accurate_massive_neutrino_transfers: false
      k_per_logint: 10
      kmax: 5

likelihood:
  ## CMB
  planck_2018_highl_plik.TTTEEE:
    path: ./external_modules
  planck_2018_lowl.TT:
    path: ./external_modules
  planck_2018_lowl.EE:
    path: ./external_modules  
  ## Supernovae
  sn.desy5:
    path: ./external_modules/data/sn_data
  ## BAO
  bao.desi_dr2.desi_bao_all:
    path: ./external_modules/data 
  ## 3x2 pt  
  des_y3.combo_3x2pt:
    path: ./external_modules/data/des_y3
    data_file: des_y3_real.dataset
    accuracyboost: 1.0
    integration_accuracy: 0
    lmax: 50000 # lmax computed for real space correlation function
    kmax_boltzmann: 5.0
    # 1 EE2, 2 Halofit
    non_linear_emul: 2
    IA_model: 1
    IA_redshift_evolution: 3
    use_baryon_pca: False

