sampler:
  mcmc:
    covmat: './projects/des_y3/EXAMPLE_MCMC2.covmat'
    covmat_params:
    learn_proposal: True
    learn_proposal_Rminus1_min: 0.035
    learn_proposal_Rminus1_max: 300
    learn_proposal_Rminus1_max_early: 1000.
    max_samples: .inf
    Rminus1_stop: 0.02
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    measure_speeds: False
    drag: False
    oversample_power: 0.2
    oversample_thin: True

    blocking:
      - [1,
          [
            beta_0, lamb, As_1e9, ns, H0, omegab, omegam
          ]
        ]

      - [2,
          [
            DES_DZ_S1, DES_DZ_S2, DES_DZ_S3, DES_DZ_S4,
            DES_A1_1, DES_A1_2, DES_A2_1, DES_A2_2, DES_BTA_1,
            DES_B1_1, DES_B1_2, DES_B1_3, DES_B1_4, DES_B1_5,
            DES_DZ_L1, DES_DZ_L2, DES_DZ_L3, DES_DZ_L4, DES_DZ_L5
          ]
        ]

      - [20,
          [
            DES_M1, DES_M2, DES_M3, DES_M4
          ]
        ]

      - [20,
          [
            A_planck,
            calib_100T,
            calib_217T,
            A_cib_217,
            xi_sz_cib,
            A_sz,
            ksz_norm,
            gal545_A_100,
            gal545_A_143,
            gal545_A_143_217,
            gal545_A_217,
            ps_A_100_100,
            ps_A_143_143,
            ps_A_143_217,
            ps_A_217_217,
            galf_TE_A_100,
            galf_TE_A_100_143,
            galf_TE_A_100_217,
            galf_TE_A_143,
            galf_TE_A_143_217,
            galf_TE_A_217
          ]
        ]

    max_tries: 10000
    burn_in: 0
    Rminus1_single_split: 4